<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers — FinOps Prime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="customers">
<div class="app-layout">
    <aside id="sidebar-wrapper" class="bg-body-tertiary"></aside>
    <div id="content-wrapper">
        <header id="topbar-wrapper" class="bg-body-tertiary"></header>
        <main class="p-3 p-md-4">

            <!-- Filters -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body py-2">
                    <div class="row g-2 align-items-center">
                        <div class="col-md-5">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                                <input type="text" class="form-control" id="custSearch" placeholder="Search name, email, phone, ID…">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select form-select-sm" id="custStatusFilter">
                                <option value="">All Status</option>
                                <option>Active</option>
                                <option>Suspended</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select form-select-sm" id="custKycFilter">
                                <option value="">All KYC</option>
                                <option>Verified</option>
                                <option>Pending</option>
                                <option>Rejected</option>
                            </select>
                        </div>
                        <div class="col-md-3 text-md-end">
                            <button class="btn btn-primary btn-sm" id="btnNewCustomer">
                                <i class="fa-solid fa-user-plus me-1"></i>New Customer
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent border-bottom d-flex justify-content-between align-items-center py-2">
                    <span class="fw-semibold small">
                        Customer Directory
                        <span class="badge text-bg-primary ms-1" id="custCount">0</span>
                    </span>
                    <div id="custPagination"></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover table-sm align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name / Email</th>
                                <th>City</th>
                                <th>Credit Score</th>
                                <th>KYC</th>
                                <th>Status</th>
                                <th>Balance</th>
                                <th>Joined</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="custTableBody"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- Slide-out Detail Panel -->
<div class="panel-overlay" id="panelOverlay"></div>
<div class="detail-panel shadow-lg" id="custDetailPanel">
    <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-body-tertiary">
        <span class="fw-semibold">Customer Details</span>
        <button class="btn btn-sm btn-outline-secondary" id="closePanelBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-3" id="custDetailBody"></div>
</div>

<!-- Customer Modal -->
<div class="modal fade" id="custModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h5 class="modal-title" id="custModalTitle">New Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="custForm" novalidate>
                <div class="modal-body">
                    <input type="hidden" id="editCustId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Full Name *</label>
                            <input class="form-control form-control-sm" id="fName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Email Address *</label>
                            <input type="email" class="form-control form-control-sm" id="fEmail" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Phone *</label>
                            <input class="form-control form-control-sm" id="fPhone" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Date of Birth</label>
                            <input type="date" class="form-control form-control-sm" id="fDob">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Address</label>
                            <input class="form-control form-control-sm" id="fAddress">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">City</label>
                            <input class="form-control form-control-sm" id="fCity">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Pincode</label>
                            <input class="form-control form-control-sm" id="fPincode" maxlength="6">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Credit Score</label>
                            <input type="number" class="form-control form-control-sm" id="fCreditScore" min="300" max="900" placeholder="300–900">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Balance (₹)</label>
                            <input type="number" class="form-control form-control-sm" id="fBalance" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Status</label>
                            <select class="form-select form-select-sm" id="fStatus">
                                <option>Active</option>
                                <option>Suspended</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">KYC Status</label>
                            <select class="form-select form-select-sm" id="fKycStatus">
                                <option>Pending</option>
                                <option>Verified</option>
                                <option>Rejected</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/app.js"></script><script src="js/customers.js"></script>
</body>
</html>
