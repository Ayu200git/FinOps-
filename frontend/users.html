<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management — FinOps Prime</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="users">

<div class="d-flex vh-100 overflow-hidden">

    <!-- Sidebar Wrapper (rendered dynamically by FinOpsUtils) -->
    <aside id="sidebar-wrapper"
           class="d-none d-lg-flex flex-column flex-shrink-0 border-end bg-body-tertiary"
           style="width:260px;"></aside>

    <div class="d-flex flex-column flex-grow-1 overflow-hidden">

        <!-- Topbar Wrapper (rendered dynamically by FinOpsUtils) -->
        <header id="topbar-wrapper" class="bg-body-tertiary"></header>

        <!-- Main Content Area -->
        <main class="flex-grow-1 overflow-y-auto p-4 bg-body-secondary position-relative">

            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-3 small">
                    <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Dashboard</a></li>
                    <li class="breadcrumb-item active" aria-current="page">User Management</li>
                </ol>
            </nav>

            <!-- Search and Filter Header Panel -->
            <div class="card border-0 shadow-sm mb-4 sticky-top bg-body z-3" style="top:-1px;">
                <div class="card-body py-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div>
                        <h5 class="fw-bold mb-1 text-primary">
                            <i class="fa-solid fa-user-shield me-2"></i>User Management & Approvals
                        </h5>
                        <p class="text-secondary small mb-0">Approve pending portal registration requests and manage role accesses.</p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <input type="text" class="form-control form-control-sm" id="userSearchInput" placeholder="Search users..." style="width:220px;">
                        <select class="form-select form-select-sm" id="statusFilter" style="width:140px;">
                            <option value="">All Statuses</option>
                            <option value="PENDING" selected>Pending Approval</option>
                            <option value="ACTIVE">Active Users</option>
                            <option value="REJECTED">Rejected Users</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="usersTable">
                        <thead>
                            <tr>
                                <th class="ps-3" style="width: 80px;">User ID</th>
                                <th>Name</th>
                                <th>Email/Username</th>
                                <th>Requested Role</th>
                                <th>Status</th>
                                <th>Registration Date</th>
                                <th class="text-end pe-3" style="width: 150px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-secondary">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                    Loading registration records...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/users.js"></script>
</body>
</html>
