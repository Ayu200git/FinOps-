<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — FinOps Prime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center" data-page="register">

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-3 mb-3" style="width:52px;height:52px;">
                    <i class="fa-solid fa-landmark fs-4 text-white"></i>
                </div>
                <h4 class="fw-bold mb-1">FinOps Prime</h4>
                <p class="text-secondary small">Enterprise Digital Lending Portal</p>
            </div>

            <!-- Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h6 class="card-title fw-semibold mb-4">Create your account</h6>

                    <form id="registerForm" novalidate autocomplete="off">
                        
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="nameInput" class="form-label fw-medium">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user text-secondary"></i></span>
                                <input type="text" class="form-control" id="nameInput"
                                       placeholder="John Doe" required>
                            </div>
                        </div>

                        <!-- Email Address -->
                        <div class="mb-3">
                            <label for="emailInput" class="form-label fw-medium">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope text-secondary"></i></span>
                                <input type="email" class="form-control" id="emailInput"
                                       placeholder="user@example.com" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control" id="passwordInput"
                                       placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary border-secondary-subtle" type="button" id="togglePasswordBtn">
                                    <i class="fa-solid fa-eye text-secondary"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label for="confirmPasswordInput" class="form-label fw-medium">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control" id="confirmPasswordInput"
                                       placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary border-secondary-subtle" type="button" id="toggleConfirmPasswordBtn">
                                    <i class="fa-solid fa-eye text-secondary"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Requested Role -->
                        <div class="mb-4">
                            <label for="roleSelect" class="form-label fw-medium">Access Level / Role</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user-tag text-secondary"></i></span>
                                <select class="form-select" id="roleSelect" required>
                                    <option value="Customer" selected>Customer / Borrower</option>
                                    <option value="Relationship Manager">Relationship Manager (RM)</option>
                                    <option value="Branch Officer">Branch Officer</option>
                                    <option value="Branch Manager">Branch Manager</option>
                                    <option value="Admin">System Administrator</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-semibold" id="registerBtn">
                            Sign Up <i class="fa-solid fa-user-plus ms-2"></i>
                        </button>
                    </form>

                </div>
                <div class="card-footer py-3 text-center border-0 bg-transparent">
                    <p class="mb-0 small text-secondary">Already have an account? <a href="index.html" class="text-primary text-decoration-none fw-semibold">Sign In</a></p>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
