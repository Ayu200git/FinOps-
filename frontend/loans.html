<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Applications — FinOps Prime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loans.css">
</head>
<body data-page="loans">
<div class="app-layout">
    <aside id="sidebar-wrapper"></aside>
    <div id="content-wrapper">
        <header id="topbar-wrapper"></header>
        <main class="page-main">

            <!-- Filters -->
            <div class="filter-bar">
                <div class="row g-2 align-items-center">
                    <div class="col-md-4"><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span><input type="text" class="form-control" id="loanSearch" placeholder="Search loan ID, customer…"></div></div>
                    <div class="col-md-2"><select class="form-select" id="loanStatusFilter"><option value="">All Status</option><option>Pending</option><option>Under Review</option><option>Approved</option><option>Rejected</option><option>Paid</option></select></div>
                    <div class="col-md-2"><select class="form-select" id="loanTypeFilter"><option value="">All Types</option><option>Personal</option><option>Home</option><option>Vehicle</option><option>Business</option><option>Education</option></select></div>
                    <div class="col-md-4 text-md-end">
                        <button class="btn btn-primary" id="btnNewLoan"><i class="fa-solid fa-file-signature me-2"></i>New Loan Application</button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Loan Applications <span class="badge bg-primary-soft ms-2" id="loanCount">0</span></span>
                    <div id="loanPagination"></div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr>
                                <th>Loan ID</th><th>Customer</th><th>Type</th><th>Principal</th>
                                <th>Rate / Term</th><th>EMI</th><th>Progress</th><th>Status</th><th class="text-end">Actions</th>
                            </tr></thead>
                            <tbody id="loanTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- New Loan Modal -->
<div class="modal fade" id="loanModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Loan Application</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="loanForm" novalidate>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Customer *</label><select class="form-select" id="lCustomer" required></select></div>
                    <div class="row g-3 mb-3">
                        <div class="col-6"><label class="form-label">Loan Type</label><select class="form-select" id="lType"><option>Personal</option><option>Home</option><option>Vehicle</option><option>Business</option><option>Education</option></select></div>
                        <div class="col-6"><label class="form-label">Purpose</label><input class="form-control" id="lPurpose" placeholder="e.g. Home Renovation"></div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6"><label class="form-label">Principal Amount (₹) *</label><input type="number" class="form-control" id="lAmount" min="10000" required></div>
                        <div class="col-6"><label class="form-label">Annual Interest Rate (%) *</label><input type="number" class="form-control" id="lRate" step="0.05" min="1" max="36" required></div>
                    </div>
                    <div class="mb-4"><label class="form-label">Loan Tenure (Months)</label>
                        <select class="form-select" id="lDuration"><option>6</option><option>12</option><option>18</option><option selected>24</option><option>36</option><option>48</option><option>60</option><option>84</option><option>120</option><option>180</option><option>240</option></select>
                    </div>
                    <!-- Live EMI Preview -->
                    <div class="emi-box">
                        <div class="emi-label">Monthly Installment (EMI)</div>
                        <div class="emi-value" id="emiDisplay">₹0.00</div>
                        <div class="d-flex justify-content-between mt-2 pt-2" style="border-top:1px solid var(--border);">
                            <div class="text-center">
                                <div class="fs-8 text-secondary">Total Payable</div>
                                <div class="fs-7 fw-600" style="color:var(--text-primary);" id="emiTotal">₹0.00</div>
                            </div>
                            <div class="text-center">
                                <div class="fs-8 text-secondary">Total Interest</div>
                                <div class="fs-7 fw-600" style="color:var(--danger);" id="emiInterest">₹0.00</div>
                            </div>
                            <div class="text-center">
                                <div class="fs-8 text-secondary">Duration</div>
                                <div class="fs-7 fw-600" style="color:var(--text-primary);" id="emiDuration">0 Months</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">File Application</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/app.js"></script><script src="js/loans.js"></script>
</body></html>
