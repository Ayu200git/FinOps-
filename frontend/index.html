<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — FinOps Prime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center" data-page="login">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

             
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-3 mb-3" style="width:52px;height:52px;">
                    <i class="fa-solid fa-landmark fs-4 text-white"></i>
                </div>
                <h4 class="fw-bold mb-1">FinOps Prime</h4>
                <p class="text-secondary small">Enterprise Digital Lending Portal</p>
            </div>
 
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h6 class="card-title fw-semibold mb-4">Sign in to your account</h6>

                    <form id="loginForm" novalidate autocomplete="off">
                         
                        <div class="mb-3">
                            <label for="emailInput" class="form-label fw-medium">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope text-secondary"></i></span>
                                <input type="email" class="form-control" id="emailInput"
                                       placeholder="officer@finops.com" required>
                            </div>
                        </div>

                         
                        <div class="mb-4">
                            <label for="passwordInput" class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                                <input type="password" class="form-control" id="passwordInput"
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                         
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">
                                    Remember Me
                                </label>
                            </div>
                            <a href="#" class="small text-primary text-decoration-none">
                                Forgot Password?
                            </a>
                        </div>

                         
                        <button type="submit" class="btn btn-primary w-100 fw-semibold" id="loginBtn">
                            Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </form>

                </div>
            </div>
 
            <!-- Demo Credentials Box -->
            <div class="card mt-3 border-0 shadow-sm">
                <div class="card-body p-3">
                    <p class="small fw-semibold text-primary mb-2 d-flex align-items-center justify-content-between">
                        <span><i class="fa-solid fa-circle-info me-1"></i> Quick Demo Logins</span>
                        <span class="text-secondary opacity-75" style="font-size:0.7rem;">Click any role to fill</span>
                    </p>
                    <div class="d-flex flex-column gap-2">
                        <div class="d-flex align-items-center justify-content-between p-2 rounded bg-body-tertiary border btn-demo-fill" data-email="admin@finops.com" data-pass="admin123" style="cursor:pointer;" title="Click to fill credentials">
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <span class="badge text-bg-danger">System Admin</span>
                                <code class="small text-body">admin@finops.com</code>
                            </div>
                            <i class="fa-solid fa-arrow-right-to-bracket text-secondary small ms-1"></i>
                        </div>
                        <div class="d-flex align-items-center justify-content-between p-2 rounded bg-body-tertiary border btn-demo-fill" data-email="bmanager@finops.com" data-pass="manager123" style="cursor:pointer;" title="Click to fill credentials">
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <span class="badge text-bg-primary">Branch Mgr</span>
                                <code class="small text-body">bmanager@finops.com</code>
                            </div>
                            <i class="fa-solid fa-arrow-right-to-bracket text-secondary small ms-1"></i>
                        </div>
                        <div class="d-flex align-items-center justify-content-between p-2 rounded bg-body-tertiary border btn-demo-fill" data-email="bofficer@finops.com" data-pass="officer123" style="cursor:pointer;" title="Click to fill credentials">
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <span class="badge text-bg-info">Branch Officer</span>
                                <code class="small text-body">bofficer@finops.com</code>
                            </div>
                            <i class="fa-solid fa-arrow-right-to-bracket text-secondary small ms-1"></i>
                        </div>
                        <div class="d-flex align-items-center justify-content-between p-2 rounded bg-body-tertiary border btn-demo-fill" data-email="rmanager@finops.com" data-pass="rm123" style="cursor:pointer;" title="Click to fill credentials">
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <span class="badge text-bg-warning">Relationship Mgr</span>
                                <code class="small text-body">rmanager@finops.com</code>
                            </div>
                            <i class="fa-solid fa-arrow-right-to-bracket text-secondary small ms-1"></i>
                        </div>
                        <div class="d-flex align-items-center justify-content-between p-2 rounded bg-body-tertiary border btn-demo-fill" data-email="customer@finops.com" data-pass="cust123" style="cursor:pointer;" title="Click to fill credentials">
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <span class="badge text-bg-success">Customer</span>
                                <code class="small text-body">customer@finops.com</code>
                            </div>
                            <i class="fa-solid fa-arrow-right-to-bracket text-secondary small ms-1"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
