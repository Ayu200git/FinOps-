<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Documents — FinOps Prime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .kyc-card { border-radius:var(--radius-lg); background:var(--bg-card); border:1px solid var(--border); overflow:hidden; transition:all var(--transition); }
        .kyc-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
        .kyc-card-header { padding:1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .kyc-card-body   { padding:1rem; }
        .doc-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
        .reject-input { display:none; }
    </style>
</head>
<body data-page="kyc">
<div class="app-layout">
    <aside id="sidebar-wrapper"></aside>
    <div id="content-wrapper">
        <header id="topbar-wrapper"></header>
        <main class="page-main">

            <!-- Filters -->
            <div class="filter-bar">
                <div class="row g-2 align-items-center">
                    <div class="col-md-4"><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span><input type="text" class="form-control" id="kycSearch" placeholder="Search by customer name, ID…"></div></div>
                    <div class="col-md-2"><select class="form-select" id="kycStatusFilter"><option value="">All Status</option><option>Pending</option><option>Verified</option><option>Rejected</option></select></div>
                    <div class="col-md-2"><select class="form-select" id="kycTypeFilter"><option value="">All Doc Types</option><option>Aadhaar Card</option><option>PAN Card</option><option>Passport</option><option>Voter ID</option><option>Driving License</option></select></div>
                    <div class="col-md-4 text-md-end">
                        <button class="btn btn-primary" id="btnUploadKyc"><i class="fa-solid fa-upload me-2"></i>Upload Document</button>
                    </div>
                </div>
            </div>

            <!-- Stats Row -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3"><div class="card text-center"><div class="card-body py-3"><div class="kpi-label mb-1">Total Docs</div><div class="fw-800 fs-4" style="color:var(--text-primary);" id="statTotal">0</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center"><div class="card-body py-3"><div class="kpi-label mb-1">Verified</div><div class="fw-800 fs-4" style="color:var(--success);" id="statVerified">0</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center"><div class="card-body py-3"><div class="kpi-label mb-1">Pending</div><div class="fw-800 fs-4" style="color:var(--warning);" id="statPending">0</div></div></div></div>
                <div class="col-6 col-md-3"><div class="card text-center"><div class="card-body py-3"><div class="kpi-label mb-1">Rejected</div><div class="fw-800 fs-4" style="color:var(--danger);" id="statRejected">0</div></div></div></div>
            </div>

            <!-- KYC Document Cards Grid -->
            <div class="row g-3" id="kycGrid"></div>

        </main>
    </div>
</div>

<!-- Upload KYC Modal -->
<div class="modal fade" id="kycModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Upload KYC Document</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="kycForm" novalidate>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Customer *</label><select class="form-select" id="kycCustomer" required></select></div>
                    <div class="mb-3"><label class="form-label">Document Type *</label>
                        <select class="form-select" id="kycDocType" required>
                            <option value="">— Select Type —</option>
                            <option>Aadhaar Card</option><option>PAN Card</option><option>Passport</option><option>Voter ID</option><option>Driving License</option><option>Bank Statement</option><option>Salary Slip</option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label">Document Number</label><input class="form-control" id="kycDocNum" placeholder="e.g. XXXX-XXXX-1234"></div>
                    <div class="mb-0">
                        <label class="form-label">Upload File</label>
                        <div style="border:2px dashed var(--border);border-radius:var(--radius-md);padding:2rem;text-align:center;cursor:pointer;background:var(--bg-hover);">
                            <i class="fa-solid fa-cloud-arrow-up fs-2 mb-2" style="color:var(--text-muted);"></i>
                            <div class="fs-8 text-secondary">Click to select file (PDF, JPG, PNG) — <em>Simulated for demo</em></div>
                            <input type="file" style="display:none;" id="kycFile" accept=".pdf,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-cloud-arrow-up me-1"></i>Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Reject Remarks Modal -->
<div class="modal fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title text-danger">Reject Document</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="rejectDocId">
                <label class="form-label">Rejection Reason *</label>
                <textarea class="form-control" id="rejectRemarks" rows="3" placeholder="State reason for rejection…"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="btnConfirmReject">Reject</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/app.js"></script><script src="js/kyc.js"></script>
</body></html>
